<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F59E0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aflac CRM">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Aflac CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0D1117; color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    input, select, textarea { -webkit-appearance: none; border-radius: 8px; font-family: inherit; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes shake { 0%,100%{transform:translateX(0)} 15%{transform:translateX(-10px)} 30%{transform:translateX(10px)} 45%{transform:translateX(-8px)} 60%{transform:translateX(8px)} 75%{transform:translateX(-4px)} 90%{transform:translateX(4px)} }
    .gm-style-iw { color: #0D1117; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ─────────────────────────────────────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────────────────────────────────────

// The business cycle, in order. Moving a business "along the cycle" steps through
// this list. "Dead" sits off-cycle (a prospect that closed lost / do-not-contact).
const CYCLE = ["Cold", "Approached", "Warm", "Meeting Set", "Presented", "Enrolled", "Client"];

const STAGES = {
  "Cold":        { color: "#64748B", bg: "rgba(100,116,139,0.15)" },
  "Approached":  { color: "#60A5FA", bg: "rgba(96,165,250,0.15)" },
  "Warm":        { color: "#FBBF24", bg: "rgba(251,191,36,0.15)" },
  "Meeting Set": { color: "#A78BFA", bg: "rgba(167,139,250,0.15)" },
  "Presented":   { color: "#FB923C", bg: "rgba(251,146,60,0.15)" },
  "Enrolled":    { color: "#34D399", bg: "rgba(52,211,153,0.15)" },
  "Client":      { color: "#10B981", bg: "rgba(16,185,129,0.2)" },
  "Dead":        { color: "#6B7280", bg: "rgba(107,114,128,0.1)" },
};
const ALL_STAGES = [...CYCLE, "Dead"];
const FILTER_STAGES = ["All", ...CYCLE, "Dead"];

const DATA_KEY = "aflac:crm:v1";        // local source of truth on this device
const GKEY_KEY = "aflac:crm:gmapsKey";  // Google Maps API key
const SEED_URL = "./data/businesses.json";

// PIN lock (matches the original app). Change CORRECT_PIN to your own.
const CORRECT_PIN = "5280";
const SESSION_KEY = "aflac:unlocked";
const SESSION_HRS = 8;

const todayISO = () => new Date().toISOString().split("T")[0];
const nowISO = () => new Date().toISOString();

// ─────────────────────────────────────────────────────────────────────────────
// Local storage
// ─────────────────────────────────────────────────────────────────────────────
function lsGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); return true; } catch { return false; } }

function loadLocal() {
  const raw = lsGet(DATA_KEY);
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : (parsed.businesses || []);
  } catch { return null; }
}
function saveLocal(businesses) {
  lsSet(DATA_KEY, JSON.stringify({ version: 1, updatedAt: nowISO(), businesses }));
}

// Merge repo seed into local data. Newest updatedAt wins per business id.
function mergeByUpdatedAt(local, incoming) {
  const map = new Map();
  (local || []).forEach(b => map.set(b.id, b));
  (incoming || []).forEach(b => {
    const cur = map.get(b.id);
    if (!cur || new Date(b.updatedAt || 0) >= new Date(cur.updatedAt || 0)) map.set(b.id, b);
  });
  return [...map.values()];
}

function blank() {
  return {
    id: "b" + Date.now(),
    business: "", dm: "", address: "", zip: "", phone: "",
    stage: "Approached", touchCount: 1,
    initialTouch: todayISO(), lastContact: todayISO(), followUp: "",
    partner: "Solo", nextAction: "", notes: "",
    lat: null, lng: null, updatedAt: nowISO(),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Follow-up urgency
// ─────────────────────────────────────────────────────────────────────────────
function urgency(followUp) {
  if (!followUp) return { label: "—", color: "#475569", days: 99999, pulse: false };
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(followUp + "T00:00:00");
  const diff = Math.round((d - t) / 86400000);
  if (diff < 0)  return { label: Math.abs(diff) + "d late", color: "#EF4444", days: diff, pulse: true };
  if (diff === 0) return { label: "Today", color: "#F59E0B", days: 0, pulse: true };
  if (diff <= 3) return { label: diff + "d", color: "#F59E0B", days: diff, pulse: false };
  if (diff <= 7) return { label: diff + "d", color: "#84CC16", days: diff, pulse: false };
  return { label: diff + "d", color: "#22C55E", days: diff, pulse: false };
}
const byUrgency = arr => [...arr].sort((a, b) => urgency(a.followUp).days - urgency(b.followUp).days);

// ─────────────────────────────────────────────────────────────────────────────
// Shared styles
// ─────────────────────────────────────────────────────────────────────────────
const INPUT = {
  width: "100%", background: "#1E293B", border: "1px solid #2A3141", borderRadius: 8,
  padding: "10px 12px", color: "#F1F5F9", fontSize: 14, outline: "none", boxSizing: "border-box",
};
const LABEL = { fontSize: 10, fontWeight: 800, color: "#64748B", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4, display: "block" };

// ─────────────────────────────────────────────────────────────────────────────
// App
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [businesses, setBusinesses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("list");
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("All");
  const [showClosed, setShowClosed] = useState(false);
  const [expanded, setExpanded] = useState(null);
  const [editing, setEditing] = useState(null); // business object or null
  const [toast, setToast] = useState("");

  useEffect(() => {
    const local = loadLocal();
    if (local && local.length) { setBusinesses(local); setLoading(false); return; }
    // First run: seed from repo
    fetch(SEED_URL).then(r => r.json()).then(j => {
      const seed = j.businesses || [];
      setBusinesses(seed); saveLocal(seed);
    }).catch(() => setBusinesses([])).finally(() => setLoading(false));
  }, []);

  function commit(next, msg) {
    setBusinesses(next);
    saveLocal(next);
    if (msg) { setToast(msg); setTimeout(() => setToast(""), 2600); }
  }
  function upsert(biz) {
    const stamped = { ...biz, updatedAt: nowISO() };
    const exists = businesses.some(b => b.id === stamped.id);
    const next = exists ? businesses.map(b => b.id === stamped.id ? stamped : b) : [...businesses, stamped];
    commit(next, exists ? "Saved " + stamped.business : "Added " + stamped.business);
  }
  function remove(id) {
    const b = businesses.find(x => x.id === id);
    commit(businesses.filter(x => x.id !== id), b ? "Deleted " + b.business : "Deleted");
    setEditing(null);
  }
  function addTouch(id) {
    const next = businesses.map(b => b.id === id
      ? { ...b, touchCount: (b.touchCount || 0) + 1, lastContact: todayISO(), updatedAt: nowISO() }
      : b);
    const b = next.find(x => x.id === id);
    commit(next, "+1 touch · " + b.business + " (T" + b.touchCount + ")");
  }
  function advance(id) {
    const b = businesses.find(x => x.id === id);
    const i = CYCLE.indexOf(b.stage);
    if (i < 0 || i >= CYCLE.length - 1) return;
    const stage = CYCLE[i + 1];
    commit(businesses.map(x => x.id === id ? { ...x, stage, lastContact: todayISO(), updatedAt: nowISO() } : x),
      b.business + " → " + stage);
  }
  // Called by the Map tab once a business gets geocoded, to cache lat/lng.
  function setCoords(id, lat, lng) {
    setBusinesses(prev => {
      const next = prev.map(b => b.id === id ? { ...b, lat, lng, updatedAt: nowISO() } : b);
      saveLocal(next);
      return next;
    });
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const active = businesses.filter(b => b.stage !== "Dead" && b.stage !== "Client").length;
  const dueNow = businesses.filter(b => {
    if (!b.followUp || b.stage === "Dead" || b.stage === "Client") return false;
    return new Date(b.followUp + "T00:00:00") <= today;
  }).length;
  const dueWeek = businesses.filter(b => {
    if (!b.followUp || b.stage === "Dead" || b.stage === "Client") return false;
    const diff = Math.round((new Date(b.followUp + "T00:00:00") - today) / 86400000);
    return diff >= 0 && diff <= 7;
  }).length;

  const visible = byUrgency(businesses.filter(b => {
    if (!showClosed && (b.stage === "Dead" || b.stage === "Client")) return false;
    if (filter !== "All" && b.stage !== filter) return false;
    if (search) {
      const q = search.toLowerCase();
      return (b.business || "").toLowerCase().includes(q)
        || (b.dm || "").toLowerCase().includes(q)
        || (b.address || "").toLowerCase().includes(q)
        || (b.zip || "").includes(q);
    }
    return true;
  }));

  if (loading) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#F59E0B" }}>Loading…</div>;

  return (
    <div style={{ minHeight: "100vh", background: "#0D1117", paddingBottom: 72 }}>
      {tab === "list" && (
        <ListScreen
          stats={{ dueNow, dueWeek, active }}
          visible={visible} total={businesses.length}
          search={search} setSearch={setSearch}
          filter={filter} setFilter={setFilter}
          showClosed={showClosed} setShowClosed={setShowClosed}
          expanded={expanded} setExpanded={setExpanded}
          onAdd={() => setEditing(blank())}
          onEdit={b => setEditing({ ...b })}
          onTouch={addTouch} onAdvance={advance}
        />
      )}
      {tab === "map" && (
        <MapScreen businesses={businesses} setCoords={setCoords} />
      )}
      {tab === "settings" && (
        <SettingsScreen businesses={businesses} commit={commit} setToast={setToast} />
      )}

      {editing && (
        <EditModal
          biz={editing}
          onChange={setEditing}
          onSave={() => { upsert(editing); setEditing(null); }}
          onDelete={() => remove(editing.id)}
          onClose={() => setEditing(null)}
          isNew={!businesses.some(b => b.id === editing.id)}
        />
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 84, left: "50%", transform: "translateX(-50%)", background: "#F59E0B", color: "#0D1117", padding: "10px 18px", borderRadius: 24, fontSize: 13, fontWeight: 800, zIndex: 300, maxWidth: "90%", textAlign: "center", boxShadow: "0 6px 24px rgba(0,0,0,0.4)" }}>{toast}</div>
      )}

      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// List screen
// ─────────────────────────────────────────────────────────────────────────────
function ListScreen({ stats, visible, total, search, setSearch, filter, setFilter, showClosed, setShowClosed, expanded, setExpanded, onAdd, onEdit, onTouch, onAdvance }) {
  return (
    <div>
      <div style={{ padding: "max(env(safe-area-inset-top), 20px) 16px 0", borderBottom: "1px solid #1A2335" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: "0.14em", color: "#F59E0B", textTransform: "uppercase", marginBottom: 3 }}>Bedrock Benefits</div>
            <div style={{ fontSize: 24, fontWeight: 900, letterSpacing: "-0.6px", lineHeight: 1 }}>CRM Tracker</div>
          </div>
          <button onClick={onAdd} style={{ background: "#F59E0B", color: "#0D1117", border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13, fontWeight: 800, cursor: "pointer" }}>+ Add</button>
        </div>
        <div style={{ display: "flex", gap: 28, paddingBottom: 16 }}>
          <Stat label="Due now" value={stats.dueNow} color={stats.dueNow > 0 ? "#EF4444" : "#475569"} />
          <Stat label="This week" value={stats.dueWeek} color="#F59E0B" />
          <Stat label="Active" value={stats.active} color="#60A5FA" />
        </div>
      </div>

      <div style={{ padding: "12px 16px 0" }}>
        <input placeholder="Search business, owner, address, ZIP…" value={search} onChange={e => setSearch(e.target.value)} style={{ ...INPUT, marginBottom: 10 }} />
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 10 }}>
          {FILTER_STAGES.map(s => (
            <Pill key={s} label={s} active={filter === s} color={STAGES[s]?.color || "#94A3B8"} onClick={() => setFilter(s)} />
          ))}
        </div>
      </div>

      <div style={{ padding: "0 16px 8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 11, color: "#475569" }}>{visible.length} of {total}</span>
        <button onClick={() => setShowClosed(v => !v)} style={{ background: "none", border: "none", color: "#475569", fontSize: 11, cursor: "pointer" }}>{showClosed ? "Hide closed" : "Show closed"}</button>
      </div>

      <div style={{ padding: "0 16px" }}>
        {visible.length === 0 && (
          <div style={{ textAlign: "center", padding: "48px 0", color: "#334155", fontSize: 14 }}>
            No businesses — tap <b style={{ color: "#F59E0B" }}>+ Add</b> to log one
          </div>
        )}
        {visible.map(b => (
          <Card key={b.id} b={b} expanded={expanded === b.id}
            onToggle={() => setExpanded(expanded === b.id ? null : b.id)}
            onEdit={() => onEdit(b)} onTouch={() => onTouch(b.id)} onAdvance={() => onAdvance(b.id)} />
        ))}
      </div>
    </div>
  );
}

function Stat({ label, value, color }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <div style={{ fontSize: 22, fontWeight: 900, color, lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: 9, color: "#475569", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", marginTop: 3 }}>{label}</div>
    </div>
  );
}
function Pill({ label, active, color, onClick }) {
  return (
    <button onClick={onClick} style={{ background: active ? color : "transparent", color: active ? "#0D1117" : "#475569", border: "1px solid " + (active ? color : "#1E293B"), borderRadius: 20, padding: "5px 12px", fontSize: 10, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", letterSpacing: "0.04em", flexShrink: 0 }}>{label}</button>
  );
}
function Badge({ children, bg, color }) {
  return <span style={{ background: bg, color, borderRadius: 4, padding: "2px 7px", fontSize: 9, fontWeight: 800, letterSpacing: "0.06em", textTransform: "uppercase" }}>{children}</span>;
}

function Card({ b, expanded, onToggle, onEdit, onTouch, onAdvance }) {
  const u = urgency(b.followUp);
  const s = STAGES[b.stage] || STAGES.Approached;
  const atEnd = b.stage === "Dead" || CYCLE.indexOf(b.stage) >= CYCLE.length - 1;
  return (
    <div onClick={onToggle} style={{ background: "#131923", borderRadius: 10, marginBottom: 7, border: "1px solid #1A2335", borderLeft: "4px solid " + u.color, cursor: "pointer", overflow: "hidden", animation: u.pulse ? "pulse 2s infinite" : "none" }}>
      <div style={{ padding: "12px 12px 10px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.business}</div>
            <div style={{ fontSize: 12, color: "#64748B", marginBottom: 7 }}>{b.dm || "—"}{b.phone ? " · " + b.phone : ""}</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, alignItems: "center" }}>
              <Badge bg={s.bg} color={s.color}>{b.stage}</Badge>
              <Badge bg="#1A2335" color="#475569">T{b.touchCount}</Badge>
              <span style={{ fontSize: 10, color: "#334155", fontWeight: 600 }}>{b.zip}</span>
              {b.partner && b.partner !== "Solo" && <span style={{ fontSize: 10, color: "#60A5FA", fontWeight: 600 }}>w/{b.partner}</span>}
            </div>
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: u.color, lineHeight: 1, marginBottom: 2 }}>{u.label}</div>
            {b.followUp && <div style={{ fontSize: 9, color: "#334155" }}>{b.followUp.slice(5).replace("-", "/")}</div>}
          </div>
        </div>
      </div>
      {expanded && (
        <div style={{ borderTop: "1px solid #1A2335", padding: "10px 12px" }} onClick={e => e.stopPropagation()}>
          {/* Address and ZIP each on their own row, as requested */}
          <Field label="Address">{b.address || "—"}</Field>
          <Field label="ZIP">{b.zip || "—"}</Field>
          {b.nextAction && <Field label="Next action" color="#F59E0B">{b.nextAction}</Field>}
          {b.notes && <Field label="Notes">{b.notes}</Field>}
          <div style={{ fontSize: 10, color: "#334155", margin: "8px 0 12px" }}>
            Initial touch: {b.initialTouch || "—"} · Last contact: {b.lastContact || "—"}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={onTouch} style={btn("#1A2335", "#64748B")}>+1 Touch</button>
            {!atEnd && <button onClick={onAdvance} style={btn("#1A2335", "#A78BFA")}>Advance →</button>}
            <button onClick={onEdit} style={btn("#F59E0B", "#0D1117")}>Edit</button>
          </div>
        </div>
      )}
    </div>
  );
}
const btn = (bg, color) => ({ flex: 1, background: bg, color, border: bg === "#1A2335" ? "1px solid #1E293B" : "none", borderRadius: 7, padding: "9px 0", fontSize: 12, fontWeight: 700, cursor: "pointer" });

function Field({ label, color, children }) {
  return (
    <div style={{ marginBottom: 9 }}>
      <div style={{ fontSize: 9, fontWeight: 800, color: color || "#475569", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 3 }}>{label}</div>
      <div style={{ fontSize: 13, color: "#94A3B8", lineHeight: 1.5 }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Edit / Add modal
// ─────────────────────────────────────────────────────────────────────────────
function EditModal({ biz, onChange, onSave, onDelete, onClose, isNew }) {
  const set = (k, v) => onChange({ ...biz, [k]: v });
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#131923", borderRadius: "16px 16px 0 0", width: "100%", maxWidth: 520, padding: "20px 16px max(28px, env(safe-area-inset-bottom))", maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ fontSize: 18, fontWeight: 900, marginBottom: 16 }}>{isNew ? "Add business" : "Edit business"}</div>

        <Row label="Business name"><input style={INPUT} value={biz.business} onChange={e => set("business", e.target.value)} /></Row>
        <Row label="Owner / decision maker"><input style={INPUT} value={biz.dm} onChange={e => set("dm", e.target.value)} /></Row>
        {/* Address and ZIP on separate rows */}
        <Row label="Address"><input style={INPUT} value={biz.address} onChange={e => set("address", e.target.value)} placeholder="Street, city, state" /></Row>
        <Row label="ZIP code"><input style={INPUT} inputMode="numeric" value={biz.zip} onChange={e => set("zip", e.target.value)} /></Row>
        <Row label="Phone"><input style={INPUT} value={biz.phone} onChange={e => set("phone", e.target.value)} /></Row>

        <div style={{ display: "flex", gap: 10 }}>
          <Row label="Stage" flex>
            <select style={INPUT} value={biz.stage} onChange={e => set("stage", e.target.value)}>
              {ALL_STAGES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </Row>
          <Row label="Touch #" flex>
            <input style={INPUT} type="number" min="0" value={biz.touchCount} onChange={e => set("touchCount", parseInt(e.target.value) || 0)} />
          </Row>
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <Row label="Initial touch" flex><input style={INPUT} type="date" value={biz.initialTouch || ""} onChange={e => set("initialTouch", e.target.value)} /></Row>
          <Row label="Follow-up date" flex><input style={INPUT} type="date" value={biz.followUp || ""} onChange={e => set("followUp", e.target.value)} /></Row>
        </div>
        <Row label="Last contact"><input style={INPUT} type="date" value={biz.lastContact || ""} onChange={e => set("lastContact", e.target.value)} /></Row>
        <Row label="Partner"><input style={INPUT} value={biz.partner} onChange={e => set("partner", e.target.value)} placeholder="Solo" /></Row>
        <Row label="Next action"><input style={INPUT} value={biz.nextAction} onChange={e => set("nextAction", e.target.value)} /></Row>
        <Row label="Notes"><textarea style={{ ...INPUT, minHeight: 80, resize: "vertical" }} value={biz.notes} onChange={e => set("notes", e.target.value)} /></Row>

        <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
          <button onClick={onClose} style={{ flex: 1, background: "#1A2335", color: "#94A3B8", border: "1px solid #1E293B", borderRadius: 8, padding: "12px 0", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Cancel</button>
          <button onClick={onSave} disabled={!biz.business.trim()} style={{ flex: 2, background: biz.business.trim() ? "#F59E0B" : "#334155", color: "#0D1117", border: "none", borderRadius: 8, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: biz.business.trim() ? "pointer" : "default" }}>Save</button>
        </div>
        {!isNew && (
          <button onClick={() => { if (confirm("Delete " + biz.business + "?")) onDelete(); }} style={{ width: "100%", background: "none", color: "#EF4444", border: "none", padding: "14px 0 0", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Delete</button>
        )}
      </div>
    </div>
  );
}
function Row({ label, children, flex }) {
  return (
    <div style={{ marginBottom: 12, flex: flex ? 1 : undefined }}>
      <label style={LABEL}>{label}</label>
      {children}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Map screen — Google Maps, markers coloured by stage
// ─────────────────────────────────────────────────────────────────────────────
let gmapsPromise = null;
function loadGoogleMaps(key) {
  if (window.google && window.google.maps) return Promise.resolve(window.google.maps);
  if (gmapsPromise) return gmapsPromise;
  gmapsPromise = new Promise((resolve, reject) => {
    const cbName = "__gmapsCb" + Date.now();
    window[cbName] = () => resolve(window.google.maps);
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) + "&callback=" + cbName;
    s.async = true;
    s.onerror = () => { gmapsPromise = null; reject(new Error("Failed to load Google Maps")); };
    document.head.appendChild(s);
  });
  return gmapsPromise;
}

function MapScreen({ businesses, setCoords }) {
  const key = lsGet(GKEY_KEY) || "";
  const mapRef = useRef(null);
  const [status, setStatus] = useState(key ? "loading" : "nokey");
  const [progress, setProgress] = useState("");

  useEffect(() => {
    if (!key) { setStatus("nokey"); return; }
    let cancelled = false;
    let map, markers = [];

    loadGoogleMaps(key).then(async (maps) => {
      if (cancelled) return;
      setStatus("ready");
      map = new maps.Map(mapRef.current, {
        center: { lat: 39.65, lng: -104.99 }, // Denver metro
        zoom: 10,
        styles: DARK_MAP_STYLE,
        disableDefaultUI: true, zoomControl: true, gestureHandling: "greedy",
      });
      const geocoder = new maps.Geocoder();
      const bounds = new maps.LatLngBounds();
      let placed = 0;

      for (const b of businesses) {
        if (cancelled) return;
        let lat = b.lat, lng = b.lng;
        if (lat == null || lng == null) {
          const q = (b.address && b.address.trim())
            ? b.address + " " + (b.zip || "")
            : (b.zip ? b.zip + ", USA" : null);
          if (!q) continue;
          setProgress("Locating " + b.business + "…");
          try {
            const res = await geocodeOnce(geocoder, q);
            if (!res) continue;
            lat = res.lat; lng = res.lng;
            setCoords(b.id, lat, lng); // cache so we don't re-geocode next time
          } catch { continue; }
        }
        const s = STAGES[b.stage] || STAGES.Approached;
        const marker = new maps.Marker({
          position: { lat, lng }, map, title: b.business,
          icon: { path: maps.SymbolPath.CIRCLE, fillColor: s.color, fillOpacity: 1, strokeColor: "#0D1117", strokeWeight: 2, scale: 8 },
        });
        const info = new maps.InfoWindow({
          content: '<div style="font-family:sans-serif;min-width:150px"><b>' + esc(b.business) + '</b><br>' +
            esc(b.dm || "") + '<br><span style="color:#555">' + esc(b.stage) + ' · T' + b.touchCount + ' · ' + esc(b.zip || "") + '</span>' +
            (b.address ? '<br><span style="color:#777;font-size:11px">' + esc(b.address) + '</span>' : '') + '</div>',
        });
        marker.addListener("click", () => info.open(map, marker));
        markers.push(marker);
        bounds.extend({ lat, lng });
        placed++;
      }
      if (!cancelled) {
        setProgress("");
        if (placed > 0) map.fitBounds(bounds);
        if (placed === 1) map.setZoom(14);
      }
    }).catch(() => { if (!cancelled) setStatus("error"); });

    return () => { cancelled = true; markers.forEach(m => m.setMap(null)); };
  }, [key, businesses.length]);

  if (status === "nokey") return <MapPlaceholder title="Add your Google Maps key" body="Go to Settings and paste a Google Maps JavaScript API key to see your businesses on the map." />;
  if (status === "error") return <MapPlaceholder title="Map couldn't load" body="Check that your Google Maps API key is valid and that Maps JavaScript API + Geocoding API are enabled for it." />;

  return (
    <div style={{ position: "relative", height: "calc(100vh - 72px)" }}>
      <div style={{ position: "absolute", top: "max(env(safe-area-inset-top), 14px)", left: 14, zIndex: 5, background: "rgba(13,17,23,0.85)", padding: "8px 12px", borderRadius: 10, border: "1px solid #1A2335" }}>
        <div style={{ fontSize: 13, fontWeight: 900, marginBottom: 6 }}>Territory map</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, maxWidth: 230 }}>
          {CYCLE.map(s => (
            <span key={s} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 9, color: "#94A3B8" }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: STAGES[s].color }} />{s}
            </span>
          ))}
        </div>
      </div>
      {progress && <div style={{ position: "absolute", bottom: 14, left: "50%", transform: "translateX(-50%)", zIndex: 5, background: "rgba(13,17,23,0.9)", padding: "6px 14px", borderRadius: 20, fontSize: 11, color: "#F59E0B" }}>{progress}</div>}
      <div ref={mapRef} style={{ width: "100%", height: "100%" }} />
    </div>
  );
}
function geocodeOnce(geocoder, q) {
  return new Promise((resolve, reject) => {
    geocoder.geocode({ address: q }, (results, status) => {
      if (status === "OK" && results[0]) {
        const loc = results[0].geometry.location;
        resolve({ lat: loc.lat(), lng: loc.lng() });
      } else if (status === "ZERO_RESULTS") { resolve(null); }
      else { reject(new Error(status)); }
    });
  });
}
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function MapPlaceholder({ title, body }) {
  return (
    <div style={{ minHeight: "calc(100vh - 72px)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 32, textAlign: "center" }}>
      <div style={{ fontSize: 40, marginBottom: 12 }}>🗺️</div>
      <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 8 }}>{title}</div>
      <div style={{ fontSize: 13, color: "#64748B", lineHeight: 1.6, maxWidth: 300 }}>{body}</div>
    </div>
  );
}
const DARK_MAP_STYLE = [
  { elementType: "geometry", stylers: [{ color: "#1d2430" }] },
  { elementType: "labels.text.stroke", stylers: [{ color: "#0D1117" }] },
  { elementType: "labels.text.fill", stylers: [{ color: "#94A3B8" }] },
  { featureType: "road", elementType: "geometry", stylers: [{ color: "#2A3141" }] },
  { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#64748B" }] },
  { featureType: "water", elementType: "geometry", stylers: [{ color: "#0b1a2b" }] },
  { featureType: "poi", stylers: [{ visibility: "off" }] },
  { featureType: "transit", stylers: [{ visibility: "off" }] },
];

// ─────────────────────────────────────────────────────────────────────────────
// Settings screen
// ─────────────────────────────────────────────────────────────────────────────
function SettingsScreen({ businesses, commit, setToast }) {
  const [key, setKey] = useState(lsGet(GKEY_KEY) || "");
  const [importText, setImportText] = useState("");
  const [syncMsg, setSyncMsg] = useState("");

  function saveKey() { lsSet(GKEY_KEY, key.trim()); setToast("Google Maps key saved"); }

  function reloadSeed() {
    setSyncMsg("Loading…");
    fetch(SEED_URL + "?t=" + Date.now()).then(r => r.json()).then(j => {
      const merged = mergeByUpdatedAt(businesses, j.businesses || []);
      commit(merged, "Synced from repo");
      setSyncMsg("Merged " + (j.businesses || []).length + " records from repo");
    }).catch(() => setSyncMsg("Couldn't reach repo data file"));
  }

  function exportJSON() {
    const payload = JSON.stringify({ version: 1, updatedAt: nowISO(), businesses }, null, 2);
    navigator.clipboard?.writeText(payload).then(() => setToast("Copied JSON to clipboard")).catch(() => {});
    const blob = new Blob([payload], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "businesses.json"; a.click();
  }

  function doImport() {
    try {
      const parsed = JSON.parse(importText);
      const incoming = Array.isArray(parsed) ? parsed : (parsed.businesses || []);
      if (!incoming.length) { setToast("No businesses found in that JSON"); return; }
      commit(mergeByUpdatedAt(businesses, incoming), "Imported " + incoming.length + " records");
      setImportText("");
    } catch { setToast("That's not valid JSON"); }
  }

  const sectionTitle = { fontSize: 11, fontWeight: 800, color: "#F59E0B", textTransform: "uppercase", letterSpacing: "0.1em", margin: "22px 0 10px" };

  return (
    <div style={{ padding: "max(env(safe-area-inset-top), 20px) 16px 24px" }}>
      <div style={{ fontSize: 24, fontWeight: 900, letterSpacing: "-0.6px", marginBottom: 4 }}>Settings</div>
      <div style={{ fontSize: 12, color: "#475569" }}>{businesses.length} businesses stored on this device</div>

      <div style={sectionTitle}>Google Maps</div>
      <label style={LABEL}>API key</label>
      <input style={INPUT} value={key} onChange={e => setKey(e.target.value)} placeholder="AIza…" />
      <div style={{ fontSize: 11, color: "#475569", margin: "6px 0 10px", lineHeight: 1.5 }}>Needs <b>Maps JavaScript API</b> + <b>Geocoding API</b> enabled. Stored only on this device.</div>
      <button onClick={saveKey} style={{ background: "#F59E0B", color: "#0D1117", border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13, fontWeight: 800, cursor: "pointer" }}>Save key</button>

      <div style={sectionTitle}>Data</div>
      <button onClick={reloadSeed} style={fullBtn}>↻ Sync from repo (pull skill updates)</button>
      {syncMsg && <div style={{ fontSize: 11, color: "#34D399", margin: "8px 0" }}>{syncMsg}</div>}
      <button onClick={exportJSON} style={{ ...fullBtn, marginTop: 8 }}>⇩ Export my data (copy + download)</button>

      <label style={{ ...LABEL, marginTop: 16 }}>Import / paste JSON</label>
      <textarea style={{ ...INPUT, minHeight: 90, resize: "vertical" }} value={importText} onChange={e => setImportText(e.target.value)} placeholder='{"businesses":[…]}' />
      <button onClick={doImport} style={{ ...fullBtn, marginTop: 8 }}>Merge imported JSON</button>

      <div style={{ fontSize: 11, color: "#334155", marginTop: 20, lineHeight: 1.6 }}>
        <b style={{ color: "#475569" }}>How updating works:</b> your phone is the live copy. The skills edit the repo's
        <code> data/businesses.json</code>; tap <b>Sync from repo</b> to pull those in. To hand your field edits back,
        tap <b>Export</b> and give that file to Claude.
      </div>
    </div>
  );
}
const fullBtn = { width: "100%", background: "#1A2335", color: "#94A3B8", border: "1px solid #1E293B", borderRadius: 8, padding: "12px 0", fontSize: 13, fontWeight: 700, cursor: "pointer" };

// ─────────────────────────────────────────────────────────────────────────────
// Tab bar
// ─────────────────────────────────────────────────────────────────────────────
function TabBar({ tab, setTab }) {
  const tabs = [["list", "List", "☰"], ["map", "Map", "🗺️"], ["settings", "Settings", "⚙︎"]];
  return (
    <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", background: "rgba(13,17,23,0.96)", borderTop: "1px solid #1A2335", paddingBottom: "env(safe-area-inset-bottom)", zIndex: 100, backdropFilter: "blur(8px)" }}>
      {tabs.map(([id, label, icon]) => (
        <button key={id} onClick={() => setTab(id)} style={{ flex: 1, background: "none", border: "none", padding: "11px 0", cursor: "pointer", color: tab === id ? "#F59E0B" : "#475569" }}>
          <div style={{ fontSize: 18, lineHeight: 1 }}>{icon}</div>
          <div style={{ fontSize: 10, fontWeight: 700, marginTop: 3 }}>{label}</div>
        </button>
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// PIN gate
// ─────────────────────────────────────────────────────────────────────────────
function PinGate({ children }) {
  const [unlocked, setUnlocked] = useState(() => {
    try {
      const ts = sessionStorage.getItem(SESSION_KEY);
      return ts ? (Date.now() - parseInt(ts) < SESSION_HRS * 3600000) : false;
    } catch { return false; }
  });
  const [input, setInput] = useState("");
  const [shake, setShake] = useState(false);

  function press(d) {
    if (shake) return;
    const next = input + d;
    if (next.length < CORRECT_PIN.length) { setInput(next); return; }
    if (next === CORRECT_PIN) {
      try { sessionStorage.setItem(SESSION_KEY, Date.now().toString()); } catch {}
      setUnlocked(true);
    } else {
      setShake(true);
      setTimeout(() => { setShake(false); setInput(""); }, 650);
    }
  }
  if (unlocked) return children;

  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", null, "0", "del"];
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", userSelect: "none", animation: shake ? "shake 0.6s ease" : "none" }}>
      <div style={{ marginBottom: 44, textAlign: "center" }}>
        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: "0.14em", color: "#F59E0B", textTransform: "uppercase", marginBottom: 6 }}>Bedrock Benefits</div>
        <div style={{ fontSize: 28, fontWeight: 900, letterSpacing: "-0.6px" }}>CRM Tracker</div>
      </div>
      <div style={{ display: "flex", gap: 16, marginBottom: 44 }}>
        {Array.from({ length: CORRECT_PIN.length }, (_, i) => (
          <div key={i} style={{ width: 14, height: 14, borderRadius: "50%", background: i < input.length ? "#F59E0B" : "transparent", border: "2px solid " + (i < input.length ? "#F59E0B" : "#334155"), transition: "all 0.15s" }} />
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 72px)", gap: 12 }}>
        {keys.map((k, i) => k === null ? <div key={i} /> : (
          <button key={i} onPointerDown={e => { e.preventDefault(); k === "del" ? setInput(v => v.slice(0, -1)) : press(k); }}
            style={{ width: 72, height: 72, borderRadius: "50%", background: k === "del" ? "transparent" : "#161B27", border: k === "del" ? "none" : "1px solid #1E293B", color: k === "del" ? "#475569" : "#F1F5F9", fontSize: k === "del" ? 18 : 22, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            {k === "del" ? "⌫" : k}
          </button>
        ))}
      </div>
      <div style={{ marginTop: 36, fontSize: 11, color: "#334155" }}>Enter PIN to continue</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PinGate><App /></PinGate>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
}
</script>
